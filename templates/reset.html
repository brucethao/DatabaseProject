{% extends 'base.html' %}

{% block title %}Welcome to Lakeside Zoo{% endblock %}

{% block content %}
    <style>
        /* Center login box */
        .login-box {
            width: 300px;
            margin: 60px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #cccccc;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2d5a27;
        }

        /* Input styles */
        input[type="text"],
        input[type="password"],
        input[type="email"]{
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #2d5a27;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #23461f;
        }
        /* error messages */
        .message{
            color: red;
        }
        /* Small links */
        .links {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .links a {
            color: #2d5a27;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
<body>


<div class="login-box">
    <h2>Reset password</h2>

    {% if messages %}
        {% for m in messages %}
            <div class="message}">
                {{ m }}
            </div>
        {% endfor %}
    {% endif %}

    <form action="{% url 'reset' %}" method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email">

        <label>New Password</label>
        <input type="password" name="password1" placeholder="Create new password">

        <label>Confirm New Password</label>
        <input type = "password" name = password2 placeholder="Confirm password">

        <button type="submit" class="login-btn">Change password</button>
    </form>

    <div class="links">
        <a href="{%  url 'login' %}">Back to Login page</a><br>
        <a href="{% url 'register' %}">Don't have account? Register here!</a><br>
        <a href="{% url 'home' %}">Back to Homepage</a>
    </div>
</div>

</body>
{% endblock %}
