{% extends 'base.html' %}

{% block title %}Welcome to Lakeside Zoo{% endblock %}

{% block content %}
    <style>
        /* Center login box */
        .login-box {
            width: 300px;
            margin: 60px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #cccccc;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2d5a27;
        }

        /* Input styles */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #2d5a27;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #23461f;
        }

        /* Small links */
        .links {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .links a {
            color: #2d5a27;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
<body>

<div class="login-box">
    <h2>Log In</h2>

    <form action="#">
        <label>Username</label>
        <input type="text" placeholder="Enter username">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <button class="login-btn">Login</button>
    </form>

    <div class="links">
        <a href="#">Forgot Password?</a><br>
        <a href="#">Don't have account? Register here!</a><br>
        <a href="{% url 'home' %}">Back to Homepage</a>
    </div>
</div>

</body>
{% endblock %}
