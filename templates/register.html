<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoo Register</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f7f3;
        }

        header {
            background-color: #2d5a27;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .nav {
            background-color: #e5efe5;
            padding: 8px 0;
            text-align: center;
            font-size: 14px;
        }

        .nav a {
            margin: 0 10px;
            color: #2d5a27;
            text-decoration: none;
            font-weight: 600;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .register-box {
            width: 340px;
            margin: 50px auto;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 8px #cccccc;
        }

        .register-box h2 {
            text-align: center;
            margin-top: 0;
            color: #2d5a27;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 14px;
        }

        .register-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2d5a27;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #23461f;
        }

        .links {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }

        .links a {
            color: #2d5a27;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    Lakeside Zoo – Register
</header>

<div class="nav">
    <a href="homepage.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
</div>

<div class="register-box">
    <h2>Create Account</h2>

    <form action="#" method="post">
        <!-- For Django: {% csrf_token %} -->
        <label for="id_username">Username</label>
        <input type="text" id="id_username" name="username" placeholder="Choose a username">

        <label for="id_email">Email</label>
        <input type="email" id="id_email" name="email" placeholder="Enter your email">

        <label for="id_password1">Password</label>
        <input type="password" id="id_password1" name="password1" placeholder="Create a password">

        <label for="id_password2">Confirm Password</label>
        <input type="password" id="id_password2" name="password2" placeholder="Confirm password">

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="links">
        Already have an account? <a href="login.html">Log in</a>
    </div>
</div>

</body>
</html>
