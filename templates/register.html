{% extends 'base.html' %}

{% block title %}Welcome to Lakeside Zoo{% endblock %}

{% block content %}

<head>
    <title>Zoo Register</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f7f3;
        }

        .nav {
            background-color: #e5efe5;
            padding: 8px 0;
            text-align: center;
            font-size: 14px;
        }

        .nav a {
            margin: 0 10px;
            color: #2d5a27;
            text-decoration: none;
            font-weight: 600;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .register-box {
            width: 380px;
            margin: 50px auto;
            background-color: white;
            border-radius: 8px;
            padding: 25px 35px; /* updated padding */
            box-shadow: 0 0 8px #cccccc;
        }

        .register-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #2d5a27;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
            color: #2d5a27;
        }

        /* ✅ Updated input styling */
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 92%;              /* FIX: smaller and centered */
            padding: 10px;
            margin: 0 auto;          /* center input fields */
            display: block;          /* allows centering */
            border-radius: 4px;
            border: 1px solid #cccccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2d5a27;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #23461f;
        }

        .links {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }

        .links a {
            color: #2d5a27;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>Create Account</h2>

    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}

        <div class="input-group">
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red; font-weight: bold; text-align: center;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

            <label for="id_firstname">First Name</label>
            <input type="text" id="id_firstname" name="first_name" placeholder="Enter your first name">
        </div>

        <div class="input-group">
            <label for="id_lastname">Last Name</label>
            <input type="text" id="id_lastname" name="last_name" placeholder="Enter your last name">
        </div>

        <div class="input-group">
            <label for="id_email">Email</label>
            <input type="email" id="id_email" name="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label for="id_username">Username</label>
            <input type="text" id="id_username" name="username" placeholder="Choose a username">
        </div>

        <div class="input-group">
            <label for="id_password1">Password</label>
            <input type="password" id="id_password1" name="password1" placeholder="Create a password">
        </div>

        <div class="input-group">
            <label for="id_password2">Confirm Password</label>
            <input type="password" id="id_password2" name="password2" placeholder="Confirm password">
        </div>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="links">
        Already have an account? <a href="login.html">Log in</a>
    </div>
</div>

</body>
{% endblock %}
